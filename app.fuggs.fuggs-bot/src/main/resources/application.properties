########################################
# General
########################################
%dev.quarkus.http.port=8104
%prod.quarkus.management.enabled=true
quarkus.banner.path=banner.txt

# Disable default Quarkus welcome page
quarkus.http.non-application-root-path=/q

# Quarkus dev mode rejects requests whose Host header isn't localhost, as
# DNS-rebinding protection - but the WhatsApp webhook needs a public tunnel
# (e.g. cloudflared) pointed at this dev instance so Meta can reach it. Safe
# to relax in dev only: the webhook itself still verifies Meta's HMAC
# signature on every POST regardless of Host header.
%dev.quarkus.http.host-validation.require-localhost=false
# Dev UI has its own separate localhost-only filter, independent of the
# setting above. Set FUGGS_DEV_TUNNEL_HOST to the current tunnel hostname
# (no scheme, e.g. "xxxx.trycloudflare.com") whenever it changes - blank by
# default so this has no effect outside a local tunnel setup.
%dev.quarkus.dev-ui.hosts=${FUGGS_DEV_TUNNEL_HOST:}

########################################
# Fuggs app document intake
########################################
quarkus.rest-client.fuggs-app.url=${FUGGS_APP_URL:http://localhost:8080}

# Shared secret sent as X-Bot-Secret to /api/bot/documents. Must match
# fuggs.bot.shared-secret on the fuggs-app side. Blank on both sides (the
# default) matches, so local dev works without setting it.
fuggs.app.shared-secret=${FUGGS_BOT_SHARED_SECRET:}

########################################
# WhatsApp Cloud API
########################################
quarkus.rest-client.whatsapp.url=${FUGGS_WHATSAPP_API_URL:https://graph.facebook.com/v21.0}

# Permanent (or temporary, during setup) access token and phone number id from
# Meta's WhatsApp API Setup page. The bot stays inert while either is unset.
fuggs.whatsapp.access-token=${FUGGS_WHATSAPP_TOKEN:}
fuggs.whatsapp.phone-number-id=${FUGGS_WHATSAPP_PHONE_NUMBER_ID:}

# App secret used to verify X-Hub-Signature-256 on incoming webhook payloads,
# and the token Meta must echo back during the webhook subscription handshake.
fuggs.whatsapp.app-secret=${FUGGS_WHATSAPP_APP_SECRET:}
fuggs.whatsapp.verify-token=${FUGGS_WHATSAPP_VERIFY_TOKEN:}

fuggs.whatsapp.enabled=true

# Never call the live Graph API from tests
%test.fuggs.whatsapp.enabled=false
