########################################
# General
########################################
%dev.quarkus.http.port=8104
%prod.quarkus.management.enabled=true
quarkus.banner.path=banner.txt

# Disable default Quarkus welcome page
quarkus.http.non-application-root-path=/q

########################################
# Telegram Bot API
########################################
quarkus.rest-client.telegram.url=${FUGGS_TELEGRAM_API_URL:https://api.telegram.org}

# Token from BotFather. The bot stays inert while this is unset.
fuggs.telegram.bot-token=${FUGGS_TELEGRAM_BOT_TOKEN:}
fuggs.telegram.enabled=true

# Long polling: no publicly reachable webhook URL required, so this works
# from a laptop. A webhook transport is planned for production.
fuggs.telegram.poll-interval=3s
fuggs.telegram.poll-timeout-seconds=0

# Never poll the live Telegram API from tests
%test.fuggs.telegram.enabled=false
